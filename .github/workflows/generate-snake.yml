name: Generate snake SVG

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prefer SNAKE_PAT (classic PAT with read:user) so private contributions
      # are included in the contribution calendar when profile settings allow it.
      - name: Generate snake
        uses: Platane/snk@v3
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_PAT || github.token }}
        with:
          github_user_name: 22ABLE22
          github_token: ${{ secrets.SNAKE_PAT || github.token }}
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          git diff --staged --quiet || git commit -m "chore: update contribution snake"
          git push
