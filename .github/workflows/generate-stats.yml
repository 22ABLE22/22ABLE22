name: Generate profile stats SVG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "STATS_PAT not set; skip to keep current cards."
            exit 0
          fi
          node generate-lang-stats.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg assets/stats-token.svg assets/rank.svg
          git diff --staged --quiet || git commit -m "chore: update stats cards"
          git push