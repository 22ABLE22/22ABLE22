name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # daily at 03:20 UTC (≈11:20 UTC+8)
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - "conf/github-profile-3d-contrib.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate default 3D contributions
        uses: 22ABLE22/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_PAT }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate custom dual-theme 3D contributions
        uses: 22ABLE22/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_PAT }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Commit 3D contrib
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f profile-3d-contrib/profile-season-animate.svg ]; then
            TS=$(date -u +%Y%m%d%H%M)
            # bust raw.githubusercontent cache for the 3D contribution image
            sed -i -E "s#(profile-3d-contrib/profile-season-animate\.svg)(\?[^\"]*)?#\1?v=${TS}#g" README.md
            # if README has no query yet, append one
            if ! grep -q 'profile-season-animate\.svg?v=' README.md; then
              sed -i -E "s#(profile-3d-contrib/profile-season-animate\.svg)(\")#\1?v=${TS}\2#g" README.md
            fi
          fi

          git add profile-3d-contrib README.md || true
          if git diff --cached --quiet; then
            echo "No 3D contrib changes"
            exit 0
          fi
          git commit -m "chore: auto-update 3D contribution calendar"
          git pull --rebase origin main || true
          git push origin main || true
