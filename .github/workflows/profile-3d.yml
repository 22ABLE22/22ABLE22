name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # daily at 03:20 UTC (≈11:20 UTC+8)
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - "conf/github-profile-3d-contrib.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      # GitHub cannot reference a private action repository via `uses:`, so the
      # generator is checked out into a sibling directory and executed with node.
      - name: Checkout 3D contrib generator
        uses: actions/checkout@v4
        with:
          repository: 22ABLE22/github-3d-contrib
          token: ${{ secrets.STATS_PAT }}
          path: .3d-generator

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate dual-theme 3D contributions
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json
        run: node .3d-generator/dist/index.js

      - name: Remove generator checkout
        run: rm -rf .3d-generator

      - name: Collect generated SVG into assets
        run: |
          set -e
          if [ -f profile-3d-contrib/profile-season-dual.svg ]; then
            mv -f profile-3d-contrib/profile-season-dual.svg assets/profile-season-dual.svg
          fi
          rm -rf profile-3d-contrib

      - name: Commit 3D contrib
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f assets/profile-season-dual.svg ]; then
            TS=$(date -u +%Y%m%d%H%M)
            sed -i -E "s#(assets/profile-season-dual\.svg)(\?[^\"]*)?#\1?v=${TS}#g" README.md
            if ! grep -q 'profile-season-dual\.svg?v=' README.md; then
              sed -i -E "s#(assets/profile-season-dual\.svg)(\")#\1?v=${TS}\2#g" README.md
            fi
          fi

          git add -A assets README.md || true
          if git diff --cached --quiet; then
            echo "No 3D contrib changes"
            exit 0
          fi
          git commit -m "chore: auto-update 3D contribution calendar"
          git pull --rebase origin main || true
          git push origin main || true
